<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:," />
    <title>Gelli's Math Game</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg1: #9db1ff;
        --bg2: #b7a6ff;
        --bg3: #d9c8ff;
        --card: #ffffff;
        --ink: #37335f;
        --ink-soft: #7a75a8;
        --purple: #7030d8;
        --purple-deep: #5724b3;
        --purple-soft: #f1ecff;
        --tile-bg: #fbfaff;
        --tile-border: #e3dbff;
        --track: #e9e4ff;
        --bubble: #f4f0ff;
        --green: #3ecf4e;
        --green-deep: #27ae3c;
        --yellow-bg: #fef9c3;
        --yellow-border: #f5cf3f;
        --yellow-ink: #713f12;
        --red-bg: #ffe1e6;
        --red-border: #fda4af;
        --chip: #ffffff;
        --shadow: 0 24px 50px rgba(76, 29, 149, 0.28);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg1: #2b2560;
          --bg2: #3a2f78;
          --bg3: #4a3a8f;
          --card: #2e2a55;
          --ink: #f2f0ff;
          --ink-soft: #b6b1e0;
          --purple: #cdb9ff;
          --purple-deep: #e3d6ff;
          --purple-soft: #3d3773;
          --tile-bg: #38336e;
          --tile-border: #554e9e;
          --track: #453f7d;
          --bubble: #3d3876;
          --yellow-bg: #5c5016;
          --yellow-border: #d9ae2e;
          --yellow-ink: #fde68a;
          --red-bg: #5f2b3a;
          --red-border: #b3546a;
          --chip: #38336e;
          --shadow: 0 24px 50px rgba(10, 5, 40, 0.55);
        }
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; }
      body {
        font-family: "Nunito", system-ui, sans-serif;
        color: var(--ink);
        background: var(--bg2);
        min-height: 100dvh;
        -webkit-tap-highlight-color: transparent;
      }
      body::before {
        content: ""; position: fixed; inset: 0; z-index: 0; pointer-events: none;
        background: linear-gradient(165deg, var(--bg1) 0%, var(--bg2) 52%, var(--bg3) 100%);
      }
      button { font-family: inherit; cursor: pointer; }
      button:focus-visible { outline: 3px solid var(--purple); outline-offset: 2px; }

      /* floating math symbols in the background world */
      .sym {
        position: fixed; z-index: 0; pointer-events: none;
        font-family: "Baloo 2", sans-serif; font-weight: 800;
        color: rgba(255, 255, 255, 0.34);
        animation: floaty 8s ease-in-out infinite;
        user-select: none;
      }
      @keyframes floaty {
        0%, 100% { transform: translateY(0) rotate(-6deg); }
        50% { transform: translateY(-16px) rotate(7deg); }
      }

      .stage {
        position: relative; z-index: 1;
        max-width: 480px; margin: 0 auto;
        padding: 20px 14px 48px;
      }

      /* ---------- shared bits ---------- */
      .card {
        background: var(--card);
        border-radius: 34px;
        box-shadow: var(--shadow);
        padding: 22px 20px;
        position: relative;
      }
      .btn {
        border: none; border-radius: 999px;
        font-family: "Baloo 2", sans-serif; font-weight: 700;
        font-size: 19px; padding: 13px 30px;
        background: var(--purple); color: #fff;
        box-shadow: 0 5px 0 var(--purple-deep);
        transition: transform 0.08s ease, box-shadow 0.08s ease;
      }
      .btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--purple-deep); }
      .btn.green { background: var(--green); box-shadow: 0 5px 0 var(--green-deep); color: #fff; }
      .btn.green:active { box-shadow: 0 1px 0 var(--green-deep); }
      .btn.ghost { background: var(--purple-soft); color: var(--purple); box-shadow: none; }
      .icon-btn {
        width: 42px; height: 42px; border-radius: 50%; border: none;
        background: var(--purple-soft); color: var(--purple);
        display: inline-flex; align-items: center; justify-content: center;
        flex: 0 0 auto;
      }
      .icon-btn svg { width: 20px; height: 20px; }

      /* ---------- home ---------- */
      .hello { display: flex; gap: 14px; align-items: center; }
      .hello .cat-wrap { width: 104px; flex: 0 0 auto; }
      .hello h1 {
        font-family: "Baloo 2", sans-serif; font-weight: 800;
        font-size: 27px; line-height: 1.12; margin: 0 0 4px; color: var(--purple);
      }
      .hello p { margin: 0; font-weight: 700; color: var(--ink-soft); font-size: 15.5px; line-height: 1.35; }
      .stats { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
      .chip {
        display: inline-flex; align-items: center; gap: 6px;
        background: var(--chip); border: 2px solid var(--tile-border);
        border-radius: 999px; padding: 6px 13px 6px 9px;
        font-family: "Baloo 2", sans-serif; font-weight: 700; font-size: 16px;
      }
      .chip svg { width: 19px; height: 19px; }
      .chip .lbl { font-family: "Nunito", sans-serif; font-size: 12px; font-weight: 800; color: var(--ink-soft); }
      .sound-btn { margin-left: auto; }

      .map-title {
        font-family: "Baloo 2", sans-serif; font-weight: 800; color: #fff;
        font-size: 21px; margin: 26px 6px 4px;
        text-shadow: 0 2px 10px rgba(76, 29, 149, 0.35);
      }
      .map { position: relative; padding: 14px 0 6px; }
      .map::before {
        content: ""; position: absolute; top: 8px; bottom: 8px; left: 50%;
        border-left: 5px dashed rgba(255, 255, 255, 0.45);
        transform: translateX(-50%);
      }
      .node-row { display: flex; margin: 6px 0; position: relative; }
      .node-row.left { justify-content: flex-start; padding-left: 7%; }
      .node-row.right { justify-content: flex-end; padding-right: 7%; }
      .node { display: flex; flex-direction: column; align-items: center; width: 128px; background: none; border: none; padding: 0; }
      .node .orb {
        width: 88px; height: 88px; border-radius: 50%;
        border: 5px solid #fff;
        display: flex; align-items: center; justify-content: center;
        box-shadow: 0 10px 22px rgba(76, 29, 149, 0.35), inset 0 -8px 0 rgba(0,0,0,0.12);
        position: relative;
      }
      .node .orb svg { width: 42px; height: 42px; }
      .node .name {
        margin-top: 8px; font-family: "Baloo 2", sans-serif; font-weight: 700;
        font-size: 15.5px; color: #fff; text-align: center; line-height: 1.15;
        text-shadow: 0 2px 8px rgba(76, 29, 149, 0.45);
      }
      .node .stars { display: flex; gap: 2px; margin-top: 3px; min-height: 18px; }
      .node .stars svg { width: 17px; height: 17px; }
      .node.locked .orb { filter: grayscale(0.9); opacity: 0.75; }
      .node.locked .name { opacity: 0.8; }
      .node .lock {
        position: absolute; right: -4px; bottom: -2px;
        width: 30px; height: 30px; border-radius: 50%;
        background: #fff; display: flex; align-items: center; justify-content: center;
        box-shadow: 0 3px 8px rgba(76, 29, 149, 0.3);
      }
      .node .lock svg { width: 16px; height: 16px; }
      .node.next .orb { animation: pulse-ring 1.8s ease-in-out infinite; }
      @keyframes pulse-ring {
        0%, 100% { box-shadow: 0 10px 22px rgba(76,29,149,.35), 0 0 0 0 rgba(255,255,255,.65), inset 0 -8px 0 rgba(0,0,0,.12); }
        50% { box-shadow: 0 10px 22px rgba(76,29,149,.35), 0 0 0 13px rgba(255,255,255,0), inset 0 -8px 0 rgba(0,0,0,.12); }
      }
      .node:not(.locked):active .orb { transform: scale(0.94); }

      .badges-card { margin-top: 22px; }
      .badges-card h2 {
        font-family: "Baloo 2", sans-serif; font-weight: 800; font-size: 20px;
        color: var(--purple); margin: 0 0 12px;
      }
      .badge-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px 6px; }
      .badge { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 5px; }
      .badge .medal {
        width: 56px; height: 56px; border-radius: 50%;
        display: flex; align-items: center; justify-content: center;
      }
      .badge .medal svg { width: 30px; height: 30px; }
      .badge .bname { font-size: 11.5px; font-weight: 800; color: var(--ink-soft); line-height: 1.15; }
      .badge.earned .medal { background: linear-gradient(150deg, #ffe27a, #ffb92e); box-shadow: 0 5px 12px rgba(245, 158, 11, 0.4); }
      .badge.notyet .medal { background: var(--purple-soft); }
      .badge.notyet { opacity: 0.55; filter: grayscale(0.7); }

      /* ---------- lesson ---------- */
      .prog-row { display: flex; align-items: center; gap: 10px; }
      .track { flex: 1; height: 17px; border-radius: 99px; background: var(--track); position: relative; }
      .fill {
        height: 100%; border-radius: 99px; width: 0%;
        background: linear-gradient(90deg, #b79cff, var(--purple));
        transition: width 0.55s cubic-bezier(0.34, 1.3, 0.5, 1);
      }
      .end-star { position: absolute; right: -9px; top: 50%; transform: translateY(-50%); width: 30px; height: 30px; }
      .end-star svg { width: 30px; height: 30px; }
      .end-star.burst { animation: starburst 0.7s ease; }
      @keyframes starburst {
        0% { transform: translateY(-50%) scale(1); }
        40% { transform: translateY(-50%) scale(1.7) rotate(24deg); }
        100% { transform: translateY(-50%) scale(1); }
      }
      .q-head {
        font-family: "Baloo 2", sans-serif; font-weight: 800;
        font-size: clamp(23px, 6vw, 29px); line-height: 1.18;
        color: var(--purple); margin: 20px 2px 0;
      }
      .visual {
        position: relative; margin-top: 34px;
        background: linear-gradient(160deg, var(--purple-soft), transparent 130%);
        border-radius: 26px; padding: 20px 12px 14px;
        display: flex; align-items: center; justify-content: center; min-height: 168px;
      }
      .visual svg.art { width: 100%; height: 198px; display: block; }
      .cat-wrap svg { width: 100%; height: auto; display: block; }
      .peek-cat {
        position: absolute; top: -34px; right: 8px; width: 92px; z-index: 3;
        transform-origin: 50% 90%;
        filter: drop-shadow(0 6px 8px rgba(76, 29, 149, 0.25));
      }
      .peek-cat.bounce { animation: cat-bounce 0.65s ease; }
      .peek-cat.nod { animation: cat-nod 0.7s ease; }
      .peek-cat.cheer { animation: cat-cheer 0.9s ease; }
      @keyframes cat-bounce {
        0%, 100% { transform: translateY(0); }
        30% { transform: translateY(-17px) rotate(-3deg); }
        55% { transform: translateY(0); }
        75% { transform: translateY(-9px) rotate(2deg); }
      }
      @keyframes cat-nod {
        0%, 100% { transform: rotate(0); }
        30% { transform: rotate(5deg) translateY(3px); }
        60% { transform: rotate(-4deg) translateY(3px); }
      }
      @keyframes cat-cheer {
        0%, 100% { transform: translateY(0) rotate(0); }
        25% { transform: translateY(-14px) rotate(-5deg); }
        50% { transform: translateY(-4px) rotate(5deg); }
        75% { transform: translateY(-12px) rotate(-3deg); }
      }
      .bubble {
        position: relative; margin-top: 16px;
        background: var(--bubble); border-radius: 20px;
        padding: 13px 16px; font-size: 17.5px; font-weight: 700; line-height: 1.4;
      }
      .bubble::before {
        content: ""; position: absolute; top: -8px; right: 44px;
        width: 18px; height: 18px; background: var(--bubble);
        transform: rotate(45deg); border-radius: 4px;
      }
      .bubble .who {
        display: block; font-family: "Baloo 2", sans-serif; font-size: 12.5px;
        letter-spacing: 0.4px; color: var(--purple); margin-bottom: 2px;
      }
      .answers { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 18px; }
      .answers.one-col { grid-template-columns: 1fr; }
      .tile {
        border: 3px solid var(--tile-border); background: var(--tile-bg);
        color: var(--ink); border-radius: 22px;
        font-family: "Baloo 2", sans-serif; font-weight: 700; font-size: 25px;
        padding: 17px 8px; min-height: 68px;
        transition: background 0.15s ease, border-color 0.15s ease, transform 0.1s ease;
      }
      .tile:active { transform: scale(0.97); }
      .tile.correct { background: var(--green); border-color: var(--green-deep); color: #fff; animation: tile-pop 0.45s ease; }
      .tile.wrong { background: var(--red-bg); border-color: var(--red-border); animation: shake 0.45s ease; }
      .tile.dim { opacity: 0.45; }
      @keyframes tile-pop { 0% { transform: scale(1); } 45% { transform: scale(1.09); } 100% { transform: scale(1); } }
      @keyframes shake {
        0%, 100% { transform: translateX(0); }
        20% { transform: translateX(-8px); }
        40% { transform: translateX(8px); }
        60% { transform: translateX(-6px); }
        80% { transform: translateX(6px); }
      }
      .aha {
        margin-top: 16px; background: var(--yellow-bg);
        border: 2.5px dashed var(--yellow-border); border-radius: 18px;
        padding: 12px 15px; font-weight: 800; font-size: 16.5px; line-height: 1.4;
        color: var(--yellow-ink);
        animation: aha-in 0.4s ease;
      }
      .aha .aha-tag {
        font-family: "Baloo 2", sans-serif; color: #d97706; margin-right: 6px;
      }
      @media (prefers-color-scheme: dark) { .aha .aha-tag { color: #fbbf24; } }
      @keyframes aha-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
      .next-row { margin-top: 18px; display: flex; justify-content: center; }
      .step-in { animation: step-in 0.35s ease; }
      @keyframes step-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

      /* Gelli's mouth moves while her recorded voice plays */
      .cat-mouth { transform-box: fill-box; transform-origin: 50% 0%; }
      .talking .cat-mouth { animation: mouth-talk 0.3s ease-in-out infinite; }
      @keyframes mouth-talk {
        0%, 100% { transform: scaleY(0.4); }
        50% { transform: scaleY(1.3); }
      }

      /* twin trick animation */
      .twin-in { animation: twin-in 1.15s cubic-bezier(0.3, 1.2, 0.4, 1) both; }
      @keyframes twin-in {
        from { transform: translate(64px, -46px) rotate(9deg); opacity: 0; }
        to { transform: translate(0, 0) rotate(0); opacity: 1; }
      }
      .whole-glow { animation: whole-glow 1.4s ease 0.9s both; }
      @keyframes whole-glow { from { opacity: 0; } to { opacity: 1; } }

      /* ---------- celebration ---------- */
      .overlay {
        position: fixed; inset: 0; z-index: 20;
        background: rgba(58, 38, 130, 0.55);
        display: flex; align-items: center; justify-content: center;
        padding: 18px;
      }
      .celebrate { max-width: 420px; width: 100%; text-align: center; padding: 30px 22px 26px; }
      .celebrate h2 {
        font-family: "Baloo 2", sans-serif; font-weight: 800; font-size: 30px;
        color: var(--purple); margin: 10px 0 2px;
      }
      .celebrate p { font-weight: 700; color: var(--ink-soft); margin: 4px 0 0; font-size: 16.5px; }
      .big-stars { display: flex; justify-content: center; gap: 8px; margin-top: 14px; }
      .big-stars svg { width: 62px; height: 62px; }
      .big-stars .pop { animation: star-pop 0.55s cubic-bezier(0.3, 1.6, 0.5, 1) both; }
      @keyframes star-pop { from { transform: scale(0) rotate(-40deg); opacity: 0; } to { transform: scale(1) rotate(0); opacity: 1; } }
      .new-badge {
        display: inline-flex; align-items: center; gap: 9px; margin-top: 18px;
        background: linear-gradient(150deg, #ffe27a, #ffb92e); color: #713f12;
        font-family: "Baloo 2", sans-serif; font-weight: 700; font-size: 17px;
        border-radius: 999px; padding: 9px 20px 9px 12px;
        box-shadow: 0 6px 14px rgba(245, 158, 11, 0.4);
      }
      .new-badge svg { width: 24px; height: 24px; }
      .celebrate .btn-row { display: flex; gap: 10px; justify-content: center; margin-top: 24px; flex-wrap: wrap; }
      .confetti { position: fixed; top: -14px; z-index: 21; border-radius: 3px; pointer-events: none; animation: confetti-fall linear both; }
      @keyframes confetti-fall {
        to { transform: translateY(105dvh) rotate(720deg); }
      }

      .foot-note { text-align: center; color: rgba(255,255,255,0.85); font-weight: 700; font-size: 13.5px; margin-top: 26px; }

      /* ---------- worlds, level, trophies ---------- */
      .world-note {
        display: flex; align-items: center; gap: 7px;
        color: rgba(255, 255, 255, 0.92); font-weight: 700; font-size: 14px; margin: 0 6px 2px;
      }
      .world-note svg { width: 15px; height: 15px; flex: 0 0 auto; }
      .level-box { margin-top: 16px; background: var(--purple-soft); border-radius: 18px; padding: 12px 14px; }
      .level-top { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; }
      .level-badge {
        font-family: "Baloo 2", sans-serif; font-weight: 800; font-size: 16.5px; color: #fff;
        background: var(--purple); border-radius: 999px; padding: 2px 13px;
      }
      .level-title { font-family: "Baloo 2", sans-serif; font-weight: 700; font-size: 16px; color: var(--purple); }
      .level-xp { margin-left: auto; font-weight: 800; font-size: 13.5px; color: var(--ink-soft); }
      .level-box .track { margin-top: 9px; }
      .level-sub { margin-top: 6px; font-size: 12.5px; font-weight: 800; color: var(--ink-soft); }
      .badge .breq { font-size: 10.5px; font-weight: 700; color: var(--ink-soft); line-height: 1.25; }
      .badge.earned .medal { color: #92400e; }
      .badge.notyet .medal { color: #a49fd0; }
      .award-pop { margin-top: 10px; }

      @media (prefers-reduced-motion: reduce) {
        .sym, .node.next .orb, .peek-cat.bounce, .peek-cat.nod, .peek-cat.cheer,
        .tile.correct, .tile.wrong, .twin-in, .whole-glow, .big-stars .pop, .confetti, .talking .cat-mouth { animation: none !important; }
        .fill, .tile, .btn { transition: none !important; }
      }
    </style>
  </head>
  <body>
    <span class="sym" style="left:4%; top:9%; font-size:44px;" aria-hidden="true">×</span>
    <span class="sym" style="right:6%; top:16%; font-size:36px; animation-delay:-2s;" aria-hidden="true">÷</span>
    <span class="sym" style="left:7%; top:46%; font-size:30px; animation-delay:-4s;" aria-hidden="true">+</span>
    <span class="sym" style="right:4%; top:55%; font-size:42px; animation-delay:-1s;" aria-hidden="true">=</span>
    <span class="sym" style="left:5%; top:78%; font-size:34px; animation-delay:-5s;" aria-hidden="true">%</span>
    <span class="sym" style="right:8%; top:84%; font-size:28px; animation-delay:-3s;" aria-hidden="true">−</span>
    <span class="sym" style="left:44%; top:3%; font-size:26px; animation-delay:-6s;" aria-hidden="true">+</span>
    <span class="sym" style="right:38%; top:93%; font-size:30px; animation-delay:-2.5s;" aria-hidden="true">×</span>

    <main class="stage" id="app"></main>

    <script>
      "use strict";
      /* ============================================================
         Gelli's Math Game — a talking-tutor math game for 2nd grade.
         Gelli the cat asks, the child taps an answer, Gelli reacts,
         and the trick animates — just like the video.
         ============================================================ */

      /* ---------- tiny SVG helpers ---------- */
      function starSVG(fill, size) {
        return '<svg viewBox="0 0 24 24" width="' + (size || 24) + '" height="' + (size || 24) + '" aria-hidden="true"><path d="M12 1.8l3.1 6.9 7.5.7-5.6 5 1.6 7.4L12 18l-6.6 3.8L7 14.4 1.4 9.4l7.5-.7z" fill="' + fill + '" stroke="rgba(0,0,0,0.08)" stroke-width="0.6"/></svg>';
      }
      function flameSVG() {
        return '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 1.5c1 3.8-1.6 5.6-3.1 7.4C7.3 10.8 6.2 12.6 6.2 15a5.8 5.8 0 0 0 11.6 0c0-1.7-.6-3-1.4-4.3-.5 1-1.2 1.7-2.2 2.1.3-3.2-.5-7.6-2.2-11.3z" fill="#ff8a3d"/><path d="M12 22.4a3.4 3.4 0 0 1-3.4-3.4c0-1.5.8-2.5 1.7-3.6.6-.8 1.2-1.6 1.7-2.7.5 1.1 1.1 1.9 1.7 2.7.9 1.1 1.7 2.1 1.7 3.6A3.4 3.4 0 0 1 12 22.4z" fill="#ffc53d"/></svg>';
      }
      function lockSVG(color) {
        return '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a5 5 0 0 0-5 5v3H6a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7a2 2 0 0 0-2-2h-1V8a5 5 0 0 0-5-5zm-3 8V8a3 3 0 1 1 6 0v3H9z" fill="' + (color || "#8a84b8") + '"/></svg>';
      }
      function soundSVG(on) {
        if (on) return '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4.5v-15L8 9H4z" fill="currentColor"/><path d="M16.5 8.6a4.4 4.4 0 0 1 0 6.8M19 6a8 8 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
        return '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4.5v-15L8 9H4z" fill="currentColor"/><path d="M16.5 9.5l5 5m0-5l-5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
      }
      function closeSVG() {
        return '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg>';
      }
      function medalSVG() {

          state.streak++;
          if (state.streak > state.bestStreak) state.bestStreak = state.streak;
          var lvlUp = addXP(10);
          if (lvlUp) run.newLevel = lvlUp;
          var freshAwards = checkAwards();
          saveProgress();
          chime("good");
          if (run.catEl) { run.catEl.classList.remove("bounce"); void run.catEl.offsetWidth; run.catEl.classList.add("bounce"); }
          var cheer = CHEERS[Math.floor(Math.random() * CHEERS.length)];
          var awardHtml = "";
          freshAwards.forEach(function (A) {
            awardHtml += '<div><span class="new-badge award-pop">' + awardIcon(A.icon) + ' New award: ' + esc(A.name) + '!</span></div>';
          });
          fb.innerHTML = '<div class="aha"><span class="aha-tag">Aha!</span>' + esc(st.aha) + '</div>' + awardHtml +
            '<div class="next-row"><button class="btn green" id="nextBtn">' +
            (run.step === run.lesson.steps.length - 1 ? "Finish!" : "Next") + '</button></div>';
          document.getElementById("nextBtn").addEventListener("click", function () { advance(); });
          speakSeq([cheer, st.aha]);
        } else {
          run.mistakes++;
          state.streak = 0;
          saveProgress();
          btn.classList.add("wrong");
          btn.disabled = true;
          chime("bad");
          if (run.catEl) { run.catEl.classList.remove("nod"); void run.catEl.offsetWidth; run.catEl.classList.add("nod"); }
          var oops = OOPS[Math.floor(Math.random() * OOPS.length)];
          fb.innerHTML = '<div class="bubble" style="margin-top:14px"><span class="who">GELLI SAYS</span>' + esc(oops) + '</div>';
          speak(oops);
        }
      }

      function advance() {
        if (run.step < run.lesson.steps.length - 1) {
          run.step++;
          renderStep(true);
        } else {
          finishLesson();
        }
      }

      function finishLesson() {
        var L = run.lesson;
        var earned = run.mistakes === 0 ? 3 : (run.mistakes <= 2 ? 2 : 1);
        var prevBest = state.stars[L.id] || 0;
        var isNewBest = earned > prevBest;
        if (isNewBest) state.stars[L.id] = earned;
        var newBadge = state.badges.indexOf(L.id) < 0;
        if (newBadge) state.badges.push(L.id);
        var wi = worldIndexOf(L);
        var worldJustDone = wi >= 0 && !run.worldWasComplete && worldComplete(wi);
        var xpGain = 0;
        if (prevBest === 0) xpGain += 25;
        if (isNewBest) xpGain += (earned - prevBest) * 20;
        if (worldJustDone) xpGain += 100;
        var lvl2 = addXP(xpGain);
        if (lvl2) run.newLevel = lvl2;
        var freshAwards = checkAwards();
        saveProgress();
        stopVoice();
        renderHome();
        chime("win");
        confetti();
        var starsHtml = "";
        for (var i = 0; i < 3; i++) {
          starsHtml += '<span class="pop" style="animation-delay:' + (0.25 + i * 0.3) + 's;display:inline-block">' +
            starSVG(i < earned ? "#ffc93d" : "#d9d4f2", 62) + '</span>';
        }
        var pills = "";
        if (newBadge) pills += '<div><span class="new-badge">' + medalSVG() + ' New badge: ' + esc(L.badge) + '</span></div>';
        if (worldJustDone && wi < WORLDS.length - 1) {
          pills += '<div><span class="new-badge">' + starSVG("#92400e", 24) + ' New world unlocked: World ' + WORLDS[wi + 1].num + ' · ' + esc(WORLDS[wi + 1].name) + '!</span></div>';
        } else if (worldJustDone) {
          pills += '<div><span class="new-badge">' + starSVG("#92400e", 24) + ' You finished the whole climb — College complete!</span></div>';
        }
        if (run.newLevel) {
          var NLI = levelInfo(state.xp);
          pills += '<div><span class="new-badge">' + awardIcon("bolt") + ' Level up! You are now Level ' + run.newLevel + ' — ' + NLI.title + '!</span></div>';
        }
        freshAwards.forEach(function (A) {
          pills += '<div><span class="new-badge">' + awardIcon(A.icon) + ' New award: ' + esc(A.name) + '!</span></div>';
        });
        var ov = document.createElement("div");
        ov.className = "overlay";
        ov.innerHTML = '<section class="card celebrate">' +
          '<div style="width:120px;margin:0 auto">' + catSVG("peek-cat cheer") + '</div>' +
          '<h2>Lesson complete!</h2><p>' + esc(L.title) + '</p>' +
          '<div class="big-stars">' + starsHtml + '</div>' + pills +
          '<div class="btn-row"><button class="btn ghost" id="againBtn">Play again</button>' +
          '<button class="btn green" id="mapBtn">Back to the map</button></div></section>';
        document.body.appendChild(ov);
        var speakParts = ["Lesson complete! You earned " + earned + (earned === 1 ? " star!" : " stars!") + " Amazing work!"];
        if (worldJustDone) speakParts.push(UNLOCK_TEXT[wi + 2]);
        if (run.newLevel) speakParts.push(LEVELUP_TEXT);
        speakSeq(speakParts);
        ov.querySelector("#mapBtn").addEventListener("click", function () { ov.remove(); });
        ov.querySelector("#againBtn").addEventListener("click", function () { ov.remove(); startLesson(L.id); });
      }

      function confetti() {
        var colors = ["#8b5cf6", "#38bdf8", "#34d399", "#facc15", "#f472b6", "#fb923c"];
        for (var i = 0; i < 46; i++) {
          var d = document.createElement("div");
          d.className = "confetti";
          var sz = 7 + Math.random() * 8;
          d.style.left = (Math.random() * 100) + "vw";
          d.style.width = sz + "px"; d.style.height = (sz * 0.5) + "px";
          d.style.background = colors[i % colors.length];
          d.style.animationDuration = (2.2 + Math.random() * 1.8) + "s";
          d.style.animationDelay = (Math.random() * 0.5) + "s";
          document.body.appendChild(d);
          (function (el) { setTimeout(function () { el.remove(); }, 4800); })(d);
        }
      }

      renderHome();
    </script>
  </body>
</html>
